[alembic]
# %(here)s = this file's own directory (identity/), regardless of the
# working directory a command is invoked from -- run from the repo root
# as: alembic -c identity/alembic.ini <command>
script_location = %(here)s/migrations

# No sqlalchemy.url here on purpose: identity/migrations/env.py reads
# Settings.auth_database_url (a SecretStr, .env-driven) instead of a
# hardcoded/plaintext connection string in a checked-in config file --
# matches this project's "never hardcode a connection detail" convention
# (see CLAUDE.md's config/ folder note).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
