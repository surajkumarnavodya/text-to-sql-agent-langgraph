name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy .

      # Only the mocked unit test suite runs in CI -- scripts/run_eval.py and
      # scripts/integration_test.py both require a live database + a running
      # Ollama instance with a model pulled, neither of which exist in this
      # runner. See CONTRIBUTING.md.
      - name: Run tests
        run: pytest

      - name: Dependency vulnerability scan (pip-audit)
        # Report-only for now (continue-on-error) -- a first run against
        # this project's actual pinned versions found real advisories
        # across several packages (mostly transitive/tooling -- chromadb,
        # langgraph, streamlit, pillow, and others; see docs/RISK_REGISTER.md's
        # R-008). Flipping this to a hard gate immediately would break CI
        # for pre-existing reasons this pass didn't introduce and wasn't
        # scoped to fix -- upgrading that backlog is a real, separate
        # effort with its own regression risk (several are major-version
        # bumps). This step exists to make the backlog visible in every CI
        # run from now on, not to hide it -- remove `continue-on-error`
        # once that backlog is triaged and the pinned versions are updated.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc
        continue-on-error: true
