name: CI

on:
  push:
    # 2026 security remediation pass: this was `branches: [main]`, a branch
    # that has never existed in this repository (the real default branch is
    # `master` -- confirmed via the GitHub API's own `default_branch` field).
    # Consequence, confirmed directly against this repo's actual Actions run
    # history, not assumed: in this workflow's entire lifetime it has run
    # exactly 6 times, all 6 on `pull_request` from Dependabot branches on
    # 2026-09-19, all 6 failing -- there has never been a single `push`-
    # triggered run. Every commit landing on `master` (this repo's only real
    # branch) since this workflow was added has skipped every gate below --
    # ruff/black/mypy/bandit/pytest/pip-audit/docker-scan/secret-scan --
    # entirely, silently, with no red X anywhere to notice. This is the
    # single highest-impact finding of this pass; see
    # SECURITY_REMEDIATION_REPORT.md.
    branches: [master]
  pull_request:
  # 2026 Phase 2 security review: lets `benchmark-regression` below be
  # triggered manually -- it never runs on an ordinary push/PR (see that
  # job's own comment for why).
  workflow_dispatch:

# 2026 security remediation pass: least-privilege default for every job's
# GITHUB_TOKEN -- previously unset, which (depending on this repo's own
# Settings > Actions token-permissions default, not verifiable from the
# workflow file alone) could have granted the broader classic default
# (read/write across most scopes) to a token every job in this file reaches
# for via `actions/checkout`. Nothing in this workflow pushes a commit,
# comments on a PR, or otherwise needs write access, so `contents: read` at
# the workflow level is sufficient for all jobs; none override it with a
# wider per-job `permissions:` block.
permissions:
  contents: read

jobs:
  # 2026 Phase 2 security review: secret scanning is its own job (not a
  # step inside `test`) so it runs even if dependency install/lint fails
  # elsewhere, and so its `fetch-depth: 0` full-history checkout (needed to
  # scan every past commit, not just the current tree) doesn't slow down
  # the other jobs, which only need the current tree.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 2026 security remediation pass: this job never pushes a commit
          # or otherwise needs to authenticate back to GitHub as itself, so
          # the checkout doesn't need a persisted git credential sitting on
          # the runner for the rest of the job to (mis)use -- defense in
          # depth alongside the workflow-level `permissions: contents: read`
          # above, same reasoning on every other checkout in this file.
          persist-credentials: false

      - name: Secret scan (gitleaks)
        # Still report-only: gitleaks itself (a Go binary) could not be
        # installed/run in the sandboxed environment this pass was done in
        # to triage its actual findings against this repo's history -- see
        # docs/security/CVE_TRIAGE.md's "Secret scanning" section. Flip to
        # blocking once a run's output has actually been read by a human
        # (or an environment where it can be run) and confirmed clean/
        # baselined. NOT a substitute for the detect-secrets step below,
        # which *was* fully run and triaged this pass and covers the exact
        # same tracked-file set with a checked-in baseline.
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Secret scan (detect-secrets, against a reviewed baseline)
        # Blocking. Unlike gitleaks above, this was actually run against
        # this repository this pass: `detect-secrets scan $(git ls-files)`
        # found 46 matches across 20 tracked files, each spot-checked and
        # confirmed a false positive (an example connection string in
        # .env.example/docs, security/redaction.py's own docstring
        # describing what it redacts, identity/password_policy.py's
        # *rejection* blocklist of known-weak passwords, Alembic revision-
        # ID hex strings) -- see docs/security/CVE_TRIAGE.md. All 20 are
        # recorded in .secrets.baseline (committed, forward-slash paths --
        # verified this matters: detect-secrets writes OS-native path
        # separators, so a baseline generated on Windows has to be
        # normalized before it matches a Linux runner's own scan output,
        # or every path would look "new" on every single run).
        #
        # `detect-secrets scan --baseline FILE` rewrites FILE in place,
        # merging in only genuinely new findings -- but it also always
        # rewrites FILE's own `generated_at` timestamp, so a naive `git
        # diff --exit-code .secrets.baseline` would fail on *every* run
        # even with zero new secrets (verified locally this pass -- the
        # first version of this step had exactly that bug). The Python
        # snippet below compares both baselines with `generated_at`
        # stripped, so this step only fails on an actual new finding
        # (verified locally too: a planted fake PEM private key in a new
        # file was correctly caught by this exact comparison).
        run: |
          pip install detect-secrets
          cp .secrets.baseline /tmp/baseline_before.json
          detect-secrets scan $(git ls-files) --baseline .secrets.baseline
          python -c "
          import json, sys
          with open('/tmp/baseline_before.json') as f:
              before = json.load(f)
          with open('.secrets.baseline') as f:
              after = json.load(f)
          before.pop('generated_at', None)
          after.pop('generated_at', None)
          if before != after:
              print('New, un-baselined finding(s) detected -- review with '
                    '`detect-secrets audit .secrets.baseline` and commit the result.')
              sys.exit(1)
          "

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # requirements-dev.txt (not requirements.txt) -- this job needs
        # pytest/black/ruff/mypy too, none of which ship in the production
        # image anymore (2026 security remediation pass; see
        # requirements.txt's own comment and requirements-dev.txt).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: SAST (bandit)
        # Blocking. Actually run against this codebase this pass (not just
        # wired and left report-only): 0 issues across 18,123 first-party
        # lines (agent/api/config/db/security/media_gen/moderation/rag/
        # search/voice/media/embeddings) -- see docs/security/CVE_TRIAGE.md
        # for the full run output. Nothing to triage, so nothing justifies
        # staying report-only; a future finding should block, not silently
        # join an ignored backlog.
        run: |
          pip install bandit
          bandit -r agent api config db security media_gen moderation rag search voice media embeddings -f txt

      # Only the mocked unit test suite runs in CI -- scripts/run_eval.py and
      # scripts/integration_test.py both require a live database + a running
      # Ollama instance with a model pulled, neither of which exist in this
      # runner. See CONTRIBUTING.md.
      - name: Run tests
        run: pytest

      - name: Dependency vulnerability scan (pip-audit)
        # Blocking, with a specific, individually-justified --ignore-vuln
        # per advisory rather than a blanket continue-on-error. Re-verified
        # fresh in the 2026 security remediation pass (not just carried
        # forward from docs/security/CVE_TRIAGE.md's 2026-09-18 analysis --
        # independently re-confirmed by re-grepping this exact checkout for
        # Checkpointer/BaseCheckpointSaver/CachePolicy/BaseCache usage, a
        # langgraph_sdk import, and chromadb.HttpClient/AsyncHttpClient
        # usage: none found, so the "not reachable" reasoning below still
        # holds today): 22 raw findings (14 unique advisories) across 6
        # packages remain -- down from 24/16/7 before this pass, which also
        # found and fixed two genuinely new findings this list never
        # covered (pypdf, pyjwt -- both reachable, both fixed by a same-
        # major-line version bump rather than an ignore; see
        # requirements.txt and SECURITY_REMEDIATION_REPORT.md) and dropped
        # pytest off this list entirely by upgrading it to a patched major
        # version instead of ignoring its finding. Every ID still ignored
        # below is either (a) in the langgraph/langgraph-checkpoint/
        # langgraph-sdk/langchain-core/chromadb family, verified NOT
        # REACHABLE -- this app never uses a LangGraph checkpointer, never
        # imports langgraph_sdk, and never constructs a chromadb
        # HttpClient/AsyncHttpClient (PersistentClient only) -- or (b)
        # black, dev-only tooling with no patched release in its pinned
        # major line and a CLI flag (`--python-cell-magics`) this repo's
        # own CI never passes. See docs/security/CVE_TRIAGE.md for the full
        # per-CVE table. A genuinely new, reachable advisory in any *other*
        # package still fails this step -- the ignore list below is an
        # allowlist of specific IDs, not a severity threshold. Scans
        # requirements-dev.txt (which itself `-r requirements.txt`s the
        # runtime set) so dev-only tooling like black -- no longer
        # installed into the production image, but still a real,
        # CI-installed dependency -- stays covered by this scan rather than
        # silently dropping out of it after the requirements split above.
        run: |
          pip install pip-audit
          pip-audit -r requirements-dev.txt --desc \
            --ignore-vuln PYSEC-2026-83 --ignore-vuln PYSEC-2026-2194 \
            --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815 --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-2121 --ignore-vuln PYSEC-2026-2120 \
            --ignore-vuln PYSEC-2026-2193 --ignore-vuln PYSEC-2026-2562 \
            --ignore-vuln PYSEC-2026-1527 --ignore-vuln PYSEC-2026-2574 \
            --ignore-vuln PYSEC-2026-2573 --ignore-vuln PYSEC-2026-2575

      - name: Type check (mypy)
        # Moved to run last and made report-only (2026 security remediation
        # pass). Previously ran second (right after ruff/black, before
        # bandit/pytest/pip-audit) and blocking -- since this `test` job's
        # steps are sequential and stop at the first failure, a failing
        # mypy step silently prevented bandit/pytest/pip-audit from ever
        # running too, on top of this workflow's own push-trigger bug (see
        # the `on.push` comment above) already meaning none of them had run
        # at all. Running `mypy .` directly against this checkout surfaces
        # 281 pre-existing errors across 51 files, all in test files, all
        # pre-dating this pass -- a real, disclosed, separately-scoped
        # type-hygiene backlog (see CLAUDE.md's "Known, pre-existing
        # CI-hygiene gaps" note), not something this security pass is
        # fixing. Keeping it in the workflow (report-only) rather than
        # deleting it so its signal isn't lost entirely, while no longer
        # letting unrelated test-file type debt block the security-relevant
        # steps above it from ever being evaluated.
        continue-on-error: true
        run: mypy .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type check (tsc)
        run: npx tsc -b --noEmit

      # Also verifies api/main.py's StaticFiles mount has something real to
      # find -- see the Dockerfile's frontend-build stage, which runs the
      # exact same command.
      - name: Build
        run: npm run build

      # 2026-09-28 addition (Google sign-in / frontend credential-safety
      # review): the two scanners above (gitleaks/detect-secrets) only ever
      # scan Git-tracked *source* files -- neither has ever looked at what
      # Vite actually bundled into frontend/dist, the one artifact a real
      # browser downloads. Pattern-only here (no backend Python
      # dependencies installed in this job) -- see
      # scripts/scan_frontend_build_for_secrets.py's own module docstring
      # for the deeper `--check-configured-secrets` mode a real deployment
      # can run locally against its own actual secrets before shipping.
      - name: Scan production build for leaked credentials
        working-directory: .
        run: python3 scripts/scan_frontend_build_for_secrets.py --dist-dir frontend/dist

  # 2026 Phase 2 security review: builds the actual image this project
  # ships (Dockerfile) and scans it for OS-package and known-vulnerable-
  # dependency CVEs -- `pip-audit` above only covers this project's own
  # Python dependency graph, not the base image's apt packages or anything
  # baked in by the frontend-build stage. Separate job (not a step in
  # `test`) so a slow multi-stage image build doesn't block the fast
  # lint/test feedback loop.
  docker-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t text-to-sql-dashboard:ci .

      - name: Vulnerability scan (Trivy)
        # 2026 security remediation pass: this was `@0.24.0`, a floating tag
        # -- and `aquasecurity/trivy-action` (and its sibling
        # `aquasecurity/setup-trivy`, not used in this repo) suffered a real
        # supply-chain compromise (CVE-2026-33634, CVSS 9.4): a threat actor
        # used compromised maintainer credentials to force-push 76 of 77
        # `trivy-action` version tags -- including `0.24.0` -- to malicious,
        # credential-stealing commits. A floating-tag pin resolves whatever
        # that tag currently points to at run time, so this workflow would
        # have executed the malicious payload on every `docker-scan` run for
        # as long as `0.24.0` stayed poisoned, with access to this job's
        # GITHUB_TOKEN and any configured secrets (this job has none beyond
        # the default token, but a future job reusing this pin might). This
        # repo's own Actions history shows the `docker-scan` job itself has
        # never actually run on a push (see the `on.push` branch-name bug
        # fixed above), so there is no evidence this specific repo executed
        # the compromised tag -- but the pin itself was live and vulnerable
        # regardless. Now pinned to the immutable commit SHA behind the
        # current `v0.36.0` release (verified against GitHub's own API at
        # pin time, not guessed -- `v0.36.0`'s own release notes show real,
        # post-incident maintenance: a `zizmor` security-lint config and a
        # dedicated `bump-trivy` workflow, consistent with a cleaned-up,
        # actively maintained repo rather than a still-compromised one).
        # Re-verify and bump this digest deliberately, the same
        # change-controlled treatment the Dockerfile's own base-image
        # digests already get (see Dockerfile's comments) -- never float
        # back to a bare version tag.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: text-to-sql-dashboard:ci
          format: table
          severity: CRITICAL,HIGH
        # Still report-only (continue-on-error). Unchanged from the prior
        # reasoning, with one correction found this pass: this step was
        # never actually capable of failing the job in the first place --
        # `aquasecurity/trivy-action` only fails a step when its own
        # `exit-code` input is set (it isn't, here), so `continue-on-error`
        # was redundant before and remains so now. Left in place, with an
        # explicit `exit-code` deliberately still not added: the base-image
        # OS-package CVE backlog this scan surfaces (see
        # docs/security/CVE_TRIAGE.md §4 -- ~17 unique Debian-package CVEs,
        # most not independently reachability-verified) hasn't been triaged
        # down to a real ignore-list the way pip-audit's own `--ignore-vuln`
        # allowlist above was -- flipping this step to fail-on-finding today
        # would turn it red for reasons unrelated to this application's own
        # code, not a meaningful gate yet. See SECURITY_REMEDIATION_REPORT.md.

  # Phase 0 of the scale-out program (docs/SCALE_OUT_PROMPT.md) -- a short
  # smoke run of the load-test harness (eval/load/) against a throwaway
  # Postgres + mock-Ollama + the real api image, all inside this runner
  # (Docker/Compose are preinstalled on GitHub-hosted runners, unlike the
  # live-Ollama/live-DB requirement that keeps `benchmark-regression`
  # below manual-only). Report-only for now (continue-on-error), same
  # pattern as gitleaks/Trivy elsewhere in this file: this is the first
  # time this job has run in CI, so its numbers haven't been triaged into
  # a real pass/fail threshold yet -- see docs/SCALE_BASELINE.md. Flip to
  # blocking once a few runs' worth of numbers have been reviewed by a
  # human.
  load-test-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run load-test smoke scenario
        run: bash eval/load/run_load_test.sh smoke
        continue-on-error: true

  # 2026 Phase 2 security review: a real Text-to-SQL accuracy/security-
  # rejection regression check (scripts/run_benchmark.py --check-
  # regression against eval/baselines/latest.json), deliberately gated
  # behind `workflow_dispatch` (manual trigger only) rather than running
  # on every push/PR -- it needs a live Ollama instance with the
  # configured model pulled and a live database, neither of which a
  # GitHub-hosted runner has (the same constraint the pre-existing
  # comment on the `test` job's own "Run tests" step already documents
  # for `scripts/run_eval.py`/`scripts/integration_test.py`). This job is
  # a real, runnable scaffold for whoever points a **self-hosted** runner
  # (`runs-on: [self-hosted, ...]`, with Ollama + a reachable database
  # configured) at this workflow -- not wired to a hosted runner here,
  # since that would just fail every time with no useful signal. See
  # docs/PHASE2_SECURITY_REPORT.md's CI/CD section for the honest state
  # of this gap.
  benchmark-regression:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Benchmark regression check
        # Requires OLLAMA_HOST/a pulled model and DB_*/DB_CONNECTIONS to be
        # configured as repository/environment secrets on whichever
        # self-hosted runner actually executes this -- absent here by
        # design (no live infrastructure exists in this repository's own
        # CI environment to point them at).
        run: python scripts/run_benchmark.py --check-regression
