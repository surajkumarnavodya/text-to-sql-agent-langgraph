[project]
name = "text-to-sql-dashboard"
version = "0.1.0"
description = "Text-to-SQL Gen AI dashboard, connected to your own database (Ollama + LangGraph + ChromaDB + SQLAlchemy + Streamlit)."
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["agent", "api", "config", "db", "embeddings", "eval", "scripts", "security", "tests", "ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length is enforced by black, not ruff
]

[tool.ruff.lint.isort]
known-first-party = ["agent", "api", "config", "db", "embeddings", "eval", "observability", "rag", "scripts", "search", "security", "ui"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection convention requires calling File()/Form()
# as an argument default (fastapi.Depends is already ruff's built-in
# default exemption) -- these are singleton marker objects FastAPI itself
# inspects at request time, not the mutable-default-argument footgun B008
# actually guards against.
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.mypy]
# Deliberately not pinned to 3.11 (the project's nominal target, see
# requires-python above): this machine's venv runs 3.14 (see CLAUDE.md's
# Python-version note), and pinning to 3.11 here makes mypy parse installed
# stubs (e.g. numpy's) using 3.11 grammar even though they were built for
# 3.14, which errors out immediately. Leaving this unset makes mypy infer
# the version from the interpreter actually running it.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["\\.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
