<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 330" width="920" height="330" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Text-to-SQL Dashboard -- animated question flow</title>
  <rect x="0" y="0" width="920" height="330" fill="#ffffff"/>

  <defs>
    <marker id="arrowhead2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- Question -->
  <rect x="10" y="140" width="150" height="72" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="85" y="170" text-anchor="middle" font-size="20">&#128172;</text>
  <text x="85" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">Your Question</text>

  <!-- Router -->
  <rect x="215" y="140" width="150" height="72" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="290" y="170" text-anchor="middle" font-size="20">&#129517;</text>
  <text x="290" y="194" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">LangGraph</text>
  <text x="290" y="209" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">Router</text>

  <path id="p0" d="M160,176 L210,176" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrowhead2)" fill="none"/>

  <!-- Sources -->
  <g>
    <rect x="430" y="8" width="200" height="58" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="452" y="43" font-size="18">&#128451;&#65039;</text>
    <text x="478" y="41" font-size="13" font-weight="600" fill="#1e1b4b">SQL Database</text>
    <text x="478" y="56" font-size="10" fill="#4338ca">read-only, validated</text>
  </g>
  <g>
    <rect x="430" y="90" width="200" height="58" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="452" y="125" font-size="18">&#128196;</text>
    <text x="478" y="123" font-size="13" font-weight="600" fill="#1e1b4b">Documents</text>
    <text x="478" y="138" font-size="10" fill="#4338ca">uploaded PDFs (RAG)</text>
  </g>
  <g>
    <rect x="430" y="172" width="200" height="58" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="452" y="207" font-size="18">&#128274;</text>
    <text x="478" y="205" font-size="13" font-weight="600" fill="#1e1b4b">Policy</text>
    <text x="478" y="220" font-size="10" fill="#4338ca">sensitivity-gated RAG</text>
  </g>
  <g>
    <rect x="430" y="254" width="200" height="58" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="452" y="289" font-size="18">&#127760;</text>
    <text x="478" y="287" font-size="13" font-weight="600" fill="#1e1b4b">Web Search</text>
    <text x="478" y="302" font-size="10" fill="#4338ca">live, external (Tavily)</text>
  </g>

  <path id="p1" d="M365,158 C 400,158 400,37 425,37" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrowhead2)" fill="none"/>
  <path id="p2" d="M365,170 C 395,170 395,119 425,119" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrowhead2)" fill="none"/>
  <path id="p3" d="M365,182 C 395,182 395,201 425,201" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrowhead2)" fill="none"/>
  <path id="p4" d="M365,194 C 400,194 400,283 425,283" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrowhead2)" fill="none"/>

  <!-- Answer -->
  <rect x="720" y="140" width="190" height="72" rx="12" fill="#4f46e5"/>
  <text x="815" y="170" text-anchor="middle" font-size="20">&#10024;</text>
  <text x="815" y="194" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Synthesized</text>
  <text x="815" y="209" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Answer + Citations</text>

  <path id="p5" d="M630,37 C 680,37 680,165 715,171" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrowhead2)" fill="none"/>
  <path id="p6" d="M630,119 C 670,119 670,168 715,174" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrowhead2)" fill="none"/>
  <path id="p7" d="M630,201 C 670,201 670,178 715,182" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrowhead2)" fill="none"/>
  <path id="p8" d="M630,283 C 680,283 680,190 715,185" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrowhead2)" fill="none"/>

  <text x="460" y="325" text-anchor="middle" font-size="11" fill="#64748b">One question can route to one source, or fan out across several -- each source's contribution is attributed under its own heading.</text>

  <!-- Flowing pulse dots: a real animated SVG (SMIL), not a fabricated screen recording -->
  <circle r="4" fill="#f59e0b">
    <animateMotion dur="1.6s" begin="0s" repeatCount="indefinite">
      <mpath href="#p0" xlink:href="#p0"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#f59e0b">
    <animateMotion dur="1.6s" begin="1.6s" repeatCount="indefinite">
      <mpath href="#p1" xlink:href="#p1"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#f59e0b">
    <animateMotion dur="1.6s" begin="1.6s" repeatCount="indefinite">
      <mpath href="#p2" xlink:href="#p2"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#f59e0b">
    <animateMotion dur="1.6s" begin="1.6s" repeatCount="indefinite">
      <mpath href="#p3" xlink:href="#p3"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#f59e0b">
    <animateMotion dur="1.6s" begin="1.6s" repeatCount="indefinite">
      <mpath href="#p4" xlink:href="#p4"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#16a34a">
    <animateMotion dur="1.4s" begin="3.2s" repeatCount="indefinite">
      <mpath href="#p5" xlink:href="#p5"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#16a34a">
    <animateMotion dur="1.4s" begin="3.2s" repeatCount="indefinite">
      <mpath href="#p6" xlink:href="#p6"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#16a34a">
    <animateMotion dur="1.4s" begin="3.2s" repeatCount="indefinite">
      <mpath href="#p7" xlink:href="#p7"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#16a34a">
    <animateMotion dur="1.4s" begin="3.2s" repeatCount="indefinite">
      <mpath href="#p8" xlink:href="#p8"/>
    </animateMotion>
  </circle>
</svg>
