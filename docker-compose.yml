# One service from one image (see Dockerfile): the FastAPI layer (api/,
# docs/API.md) also serves the built React dashboard from the same
# process/port (api/main.py's StaticFiles mount) -- a separate Streamlit UI
# container used to run alongside this one; it's gone now, and so is the
# separate port that came with it. Deliberately does NOT include Ollama or
# the target database as services here -- both are external/user-provided
# by this project's own design (config-driven "connect to your own DB",
# fully local Ollama you already run) -- see docs/DEPLOYMENT.md for how to
# point this container at a host-run Ollama and an external database. No
# Kubernetes: this is the whole deployment footprint for a single-instance
# production deployment; see docs/PRODUCTION_READINESS_REPORT.md's roadmap
# for when that might change.

services:
  api:
    build: .
    image: text-to-sql-dashboard:latest
    ports:
      # Bound to 127.0.0.1 by default -- secure by default, since an
      # unqualified "8000:8000" mapping binds all host interfaces (reachable
      # from the whole network the host is on, not just localhost). Set
      # API_BIND_HOST=0.0.0.0 in .env (or your actual reverse-proxy-facing
      # interface) if you deliberately want this reachable beyond the host
      # itself -- see docs/DEPLOYMENT.md for the recommended
      # authenticating-reverse-proxy pattern before doing that.
      - "${API_BIND_HOST:-127.0.0.1}:8000:8000"
    env_file:
      - .env
    extra_hosts:
      # Lets OLLAMA_HOST=http://host.docker.internal:11434 in .env reach an
      # Ollama server running on the host -- Docker Desktop (Windows/Mac)
      # resolves this automatically; `host-gateway` makes it also resolve
      # on Linux (Docker Engine 20.10+). A no-op if OLLAMA_HOST points
      # somewhere else. See docs/DEPLOYMENT.md.
      - "host.docker.internal:host-gateway"
    volumes:
      # Named volume, not a bind mount: the Chroma index is regenerated
      # data (scripts/build_embeddings.py / the dashboard's "Refresh
      # Schema" button own its lifecycle), not source you'd want to edit
      # from the host -- see the volume's own comment below for the
      # schema-change implication.
      - chroma_index:/app/embeddings/.chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    # 2026 Phase 2 security review: the app already runs as a non-root
    # user (see the Dockerfile) and needs no Linux capability at all
    # (it binds port 8000, not a privileged <1024 port, and does no raw
    # networking/device access) -- dropping every capability and
    # forbidding privilege-escalation-via-setuid closes off what a
    # container-escape/RCE exploit chain could otherwise still reach for,
    # even though neither is believed to be currently exploitable on its
    # own. `read_only: true` (a fully read-only root filesystem) was
    # deliberately NOT added here despite being the next natural
    # hardening step -- this app writes to more paths than the one named
    # `chroma_index` volume already covers (Piper voice models, video
    # keyframe thumbnails, faster-whisper's HuggingFace cache, and
    # whatever ordinary temp-file usage its dependencies do), and getting
    # every one of those right requires verifying against a real running
    # container this environment can't do -- see
    # docs/PHASE2_SECURITY_REPORT.md's Docker section.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Resource limits -- bounds a single container's worst-case CPU/memory
    # footprint (e.g. under the kind of unbounded-request-concurrency
    # scenario docs/THREAT_MODEL.md's resource-exhaustion entries
    # describe) rather than letting it consume the whole host. Sized
    # generously (this process holds a compiled LangGraph graph, a
    # ChromaDB client, and -- if media search is enabled -- a local CLIP
    # model in memory) -- tune to your actual deployment's headroom, not
    # a value to copy blindly.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

volumes:
  # Persists the schema embedding index across container restarts/recreates.
  # Rebuilding the image does not clear this -- run
  # `docker compose exec api python scripts/build_embeddings.py` after a
  # real schema change, same as the non-Docker README instructs locally.
  chroma_index:
